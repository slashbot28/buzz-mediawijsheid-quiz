<!DOCTYPE html>
<html lang="nl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUZZ! Online Vragen Studio • Mediawijsheid &amp; PS5 Buzz Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="studio-bg studio-grid min-h-screen flex flex-col text-white">

  <header class="bg-slate-950/85 backdrop-blur-md border-b border-white/10 px-4 py-3 sm:px-6 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-xl shadow-lg">📚</div>
      <div>
        <h1 class="font-display font-black text-lg sm:text-xl text-amber-300 leading-none">BUZZ! ONLINE VRAGEN STUDIO</h1>
        <p class="text-xs text-slate-400 font-semibold">Vragen &amp; categorieën online beheren voor Mediawijsheid én PS5 Buzz Quiz</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <a href="index.html" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs sm:text-sm font-bold border border-white/15 transition">
        ← Terug naar Quiz
      </a>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto px-4 py-6 sm:px-6 flex flex-col gap-5">

    <div id="studioToast" class="hidden fixed bottom-5 right-5 z-50 px-4 py-3 rounded-2xl font-bold text-sm shadow-2xl"></div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
      <!-- ==================== LEFT: CLOUD SETS & PS5 API ==================== -->
      <div class="lg:col-span-5 flex flex-col gap-5">

        <!-- Online Vragensets -->
        <section class="bg-slate-900/85 border border-white/10 rounded-3xl p-5 shadow-xl flex flex-col gap-3">
          <div class="flex items-center justify-between gap-2">
            <h2 class="font-heading font-bold text-lg text-white">☁️ Online Vragensets</h2>
            <button id="btnRefreshSets" class="px-3 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-white/10 cursor-pointer">
              🔄 Ververs
            </button>
          </div>
          <div id="cloudSetsList" class="flex flex-col gap-2 max-h-56 overflow-y-auto pr-1">
            <div class="text-xs text-slate-400">Online sets laden...</div>
          </div>
          <button id="btnLoadDefaults" class="self-start text-xs font-bold text-sky-300 hover:text-sky-200 underline cursor-pointer">
            + Start met standaard Mediawijsheid-vragen (48)
          </button>
        </section>

        <!-- Opslaan in de Cloud -->
        <section class="bg-slate-900/85 border border-amber-400/30 rounded-3xl p-5 shadow-xl flex flex-col gap-3">
          <h2 class="font-heading font-bold text-lg text-amber-300">💾 Publiceer / Update Online</h2>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="text-[11px] font-bold text-slate-400 block mb-1">Set-ID (zonder spaties)</label>
              <input id="inpSetId" type="text" value="ps5-buzz" placeholder="bv. ps5-buzz" class="w-full bg-slate-950 border border-white/15 rounded-xl px-3 py-2 text-xs font-bold text-white" />
            </div>
            <div>
              <label class="text-[11px] font-bold text-slate-400 block mb-1">Optionele PIN-code</label>
              <input id="inpSetPin" type="text" placeholder="optioneel" class="w-full bg-slate-950 border border-white/15 rounded-xl px-3 py-2 text-xs font-bold text-white" />
            </div>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-400 block mb-1">Titel van deze vragenset</label>
            <input id="inpSetTitle" type="text" value="PS5 Buzz Quiz Set" placeholder="bv. PS5 Buzz Quiz - Algemene Kennis" class="w-full bg-slate-950 border border-white/15 rounded-xl px-3 py-2 text-xs font-bold text-white" />
          </div>
          <button id="btnSaveCloud" class="w-full py-3 rounded-2xl bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-display font-black text-base shadow-lg cursor-pointer">
            ☁️ Opslaan in Cloud
          </button>
        </section>

        <!-- Koppeling voor PS5 Buzz Quiz & Mediawijsheid -->
        <section class="bg-slate-900/85 border border-sky-400/30 rounded-3xl p-5 shadow-xl flex flex-col gap-3">
          <h2 class="font-heading font-bold text-lg text-sky-300">🎮 Gebruik in je PS5 Buzz Quiz / Mediawijsheid</h2>
          <div>
            <label class="text-[11px] font-bold text-slate-400 block mb-1">1. Directe Quiz-Link (Mediawijsheid):</label>
            <div class="flex gap-2">
              <input id="outQuizLink" type="text" readonly class="flex-1 bg-slate-950 border border-white/15 rounded-xl px-3 py-1.5 text-xs text-emerald-300 font-mono" />
              <button data-copy="outQuizLink" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold cursor-pointer">📋</button>
            </div>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-400 block mb-1">2. Directe API-URL (voor je PS5 Buzz Quiz project):</label>
            <div class="flex gap-2">
              <input id="outApiUrl" type="text" readonly class="flex-1 bg-slate-950 border border-white/15 rounded-xl px-3 py-1.5 text-xs text-sky-300 font-mono" />
              <button data-copy="outApiUrl" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold cursor-pointer">📋</button>
            </div>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-400 block mb-1">3. JavaScript code voor PS5 Buzz Quiz:</label>
            <textarea id="outPs5Snippet" rows="5" readonly class="w-full bg-slate-950 border border-white/15 rounded-xl p-2.5 text-[11px] text-slate-200 font-mono"></textarea>
          </div>
        </section>
      </div>

      <!-- ==================== RIGHT: CATEGORIEËN & VRAGEN EDITOR ==================== -->
      <div class="lg:col-span-7 flex flex-col gap-5">
        <!-- Categorieën -->
        <section class="bg-slate-900/85 border border-white/10 rounded-3xl p-5 shadow-xl flex flex-col gap-3">
          <h2 class="font-heading font-bold text-lg text-white">🏷️ Categorieën in deze Set</h2>
          <form id="formAddCat" class="grid grid-cols-1 sm:grid-cols-12 gap-2">
            <input id="catIcon" type="text" value="🎮" maxlength="4" class="sm:col-span-2 bg-slate-950 border border-white/15 rounded-xl px-2 py-2 text-center text-lg" />
            <input id="catTitle" type="text" required placeholder="Categorienaam (bv. Gaming)" class="sm:col-span-5 bg-slate-950 border border-white/15 rounded-xl px-3 py-2 text-xs font-bold text-white" />
            <input id="catSub" type="text" placeholder="Ondertitel" class="sm:col-span-3 bg-slate-950 border border-white/15 rounded-xl px-3 py-2 text-xs text-white" />
            <button type="submit" class="sm:col-span-2 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs cursor-pointer">+ Toevoegen</button>
          </form>
          <div id="catChips" class="flex flex-wrap gap-1.5"></div>
        </section>

        <!-- Vraag Toevoegen -->
        <section class="bg-slate-900/85 border border-white/10 rounded-3xl p-5 shadow-xl flex flex-col gap-3">
          <div class="flex items-center justify-between gap-2">
            <h2 class="font-heading font-bold text-lg text-white">❓ Vragen (<span id="qCount">0</span>)</h2>
            <div class="flex gap-2">
              <button id="btnExportJson" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold cursor-pointer">💾 JSON</button>
              <label class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold cursor-pointer">
                📂 Laad CSV/JSON
                <input id="inpFileUpload" type="file" accept=".csv,.json,.txt" class="hidden" />
              </label>
            </div>
          </div>

          <form id="formAddQ" class="bg-slate-950/75 border border-white/10 rounded-2xl p-4 flex flex-col gap-2.5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <select id="qCat" class="bg-slate-900 border border-white/15 rounded-xl px-3 py-2 text-xs font-bold text-white"></select>
              <input id="qBadge" type="text" placeholder="Label (optioneel, bv. 🎮 PS5)" class="bg-slate-900 border border-white/15 rounded-xl px-3 py-2 text-xs text-white" />
            </div>
            <textarea id="qText" rows="2" required placeholder="Typ de quizvraag..." class="bg-slate-900 border border-white/15 rounded-xl px-3 py-2 text-xs font-semibold text-white"></textarea>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <label class="flex items-center gap-2 bg-slate-900 rounded-xl px-2.5 py-1.5 border border-white/10">
                <input type="radio" name="qCorrect" value="0" checked class="accent-sky-400" />
                <span>🔵</span>
                <input id="qOpt0" type="text" required placeholder="Blauw" class="flex-1 bg-transparent text-xs text-white focus:outline-none" />
              </label>
              <label class="flex items-center gap-2 bg-slate-900 rounded-xl px-2.5 py-1.5 border border-white/10">
                <input type="radio" name="qCorrect" value="1" class="accent-orange-400" />
                <span>🟠</span>
                <input id="qOpt1" type="text" required placeholder="Oranje" class="flex-1 bg-transparent text-xs text-white focus:outline-none" />
              </label>
              <label class="flex items-center gap-2 bg-slate-900 rounded-xl px-2.5 py-1.5 border border-white/10">
                <input type="radio" name="qCorrect" value="2" class="accent-emerald-400" />
                <span>🟢</span>
                <input id="qOpt2" type="text" required placeholder="Groen" class="flex-1 bg-transparent text-xs text-white focus:outline-none" />
              </label>
              <label class="flex items-center gap-2 bg-slate-900 rounded-xl px-2.5 py-1.5 border border-white/10">
                <input type="radio" name="qCorrect" value="3" class="accent-yellow-400" />
                <span>🟡</span>
                <input id="qOpt3" type="text" required placeholder="Geel" class="flex-1 bg-transparent text-xs text-white focus:outline-none" />
              </label>
            </div>
            <div class="flex flex-col sm:flex-row gap-2">
              <input id="qExpl" type="text" placeholder="Korte uitleg na de vraag..." class="flex-1 bg-slate-900 border border-white/15 rounded-xl px-3 py-2 text-xs text-white" />
              <button type="submit" class="px-5 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs cursor-pointer">
                + Vraag Toevoegen
              </button>
            </div>
          </form>

          <div id="qList" class="flex flex-col gap-2 max-h-96 overflow-y-auto pr-1"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="js/questions.js"></script>
  <script src="js/cloud-store.js"></script>
  <script>
    (() => {
      let categories = JSON.parse(JSON.stringify(window.BUZZ_CATEGORIES || []));
      let questions = JSON.parse(JSON.stringify(window.BUZZ_QUESTIONS || []));

      const el = {
        toast: document.getElementById('studioToast'),
        cloudSetsList: document.getElementById('cloudSetsList'),
        btnRefreshSets: document.getElementById('btnRefreshSets'),
        btnLoadDefaults: document.getElementById('btnLoadDefaults'),
        inpSetId: document.getElementById('inpSetId'),
        inpSetPin: document.getElementById('inpSetPin'),
        inpSetTitle: document.getElementById('inpSetTitle'),
        btnSaveCloud: document.getElementById('btnSaveCloud'),
        outQuizLink: document.getElementById('outQuizLink'),
        outApiUrl: document.getElementById('outApiUrl'),
        outPs5Snippet: document.getElementById('outPs5Snippet'),
        formAddCat: document.getElementById('formAddCat'),
        catIcon: document.getElementById('catIcon'),
        catTitle: document.getElementById('catTitle'),
        catSub: document.getElementById('catSub'),
        catChips: document.getElementById('catChips'),
        qCount: document.getElementById('qCount'),
        formAddQ: document.getElementById('formAddQ'),
        qCat: document.getElementById('qCat'),
        qBadge: document.getElementById('qBadge'),
        qText: document.getElementById('qText'),
        qOpts: [0, 1, 2, 3].map((i) => document.getElementById(`qOpt${i}`)),
        qExpl: document.getElementById('qExpl'),
        qList: document.getElementById('qList'),
        btnExportJson: document.getElementById('btnExportJson'),
        inpFileUpload: document.getElementById('inpFileUpload')
      };

      function toast(msg, isErr = false) {
        el.toast.textContent = msg;
        el.toast.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-2xl font-bold text-sm shadow-2xl ${
          isErr ? 'bg-rose-600 text-white' : 'bg-emerald-500 text-slate-950'
        }`;
        el.toast.classList.remove('hidden');
        setTimeout(() => el.toast.classList.add('hidden'), 4000);
      }

      function updateLinks() {
        const setId = (el.inpSetId.value || 'ps5-buzz').trim().toLowerCase();
        const origin = window.location.origin;
        el.outQuizLink.value = `${origin}/?set=${encodeURIComponent(setId)}`;
        const apiUrl = window.CloudQuizStore.getApiUrl(setId);
        el.outApiUrl.value = apiUrl;
        el.outPs5Snippet.value =
`const res = await fetch("${apiUrl}");
const doc = await res.json();
const categories = JSON.parse(doc.fields.categoriesJson.stringValue);
const questions = JSON.parse(doc.fields.questionsJson.stringValue);`;
      }

      function renderEditor() {
        const editableCats = categories.filter((c) => c.id !== 'mix');
        el.qCat.innerHTML = '';
        editableCats.forEach((c) => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = `${c.icon} ${c.title}`;
          el.qCat.appendChild(opt);
        });

        el.catChips.innerHTML = '';
        editableCats.forEach((c) => {
          const chip = document.createElement('div');
          chip.className = 'inline-flex items-center gap-2 px-3 py-1 rounded-xl bg-slate-950 border border-white/15 text-xs font-bold';
          chip.innerHTML = `<span>${c.icon} ${c.title}</span><button type="button" data-del-cat="${c.id}" class="text-rose-400 cursor-pointer">✕</button>`;
          el.catChips.appendChild(chip);
        });
        el.catChips.querySelectorAll('[data-del-cat]').forEach((b) => {
          b.onclick = () => {
            categories = categories.filter((c) => c.id !== b.dataset.delCat);
            questions = questions.filter((q) => q.category !== b.dataset.delCat);
            renderEditor();
          };
        });

        el.qCount.textContent = questions.length;
        el.qList.innerHTML = '';
        const icons = ['🔵', '🟠', '🟢', '🟡'];
        questions.forEach((q, idx) => {
          const row = document.createElement('div');
          row.className = 'p-3 rounded-2xl bg-slate-950/80 border border-white/10 flex items-start justify-between gap-3';
          row.innerHTML = `
            <div class="min-w-0 flex-1">
              <div class="text-[11px] font-bold text-amber-300">${q.badge || q.category}</div>
              <div class="font-bold text-sm text-white mb-1">${q.question}</div>
              <div class="grid grid-cols-2 gap-1 text-xs text-slate-300">
                ${q.options.map((o, i) => `<div class="${i === q.correct ? 'text-emerald-300 font-bold' : 'opacity-70'}">${icons[i]} ${o}</div>`).join('')}
              </div>
            </div>
            <button type="button" data-del-q="${idx}" class="px-2 py-1 rounded-lg bg-rose-500/20 text-rose-300 text-xs font-bold cursor-pointer">🗑️</button>
          `;
          el.qList.appendChild(row);
        });
        el.qList.querySelectorAll('[data-del-q]').forEach((b) => {
          b.onclick = () => {
            questions.splice(Number(b.dataset.delQ), 1);
            renderEditor();
          };
        });
      }

      async function refreshCloudSets() {
        el.cloudSetsList.innerHTML = '<div class="text-xs text-slate-400">Laden...</div>';
        try {
          const sets = await window.CloudQuizStore.listSets();
          if (sets.length === 0) {
            el.cloudSetsList.innerHTML = '<div class="text-xs text-slate-400">Nog geen online sets opgeslagen. Klik op "Opslaan in Cloud" om je eerste set aan te maken!</div>';
            return;
          }
          el.cloudSetsList.innerHTML = '';
          sets.forEach((s) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'w-full text-left p-2.5 rounded-xl bg-slate-950/80 hover:bg-slate-800 border border-white/10 flex items-center justify-between gap-2 transition cursor-pointer';
            btn.innerHTML = `
              <div>
                <div class="font-bold text-xs text-white">${s.title} ${s.hasPin ? '🔒' : ''}</div>
                <div class="text-[11px] text-slate-400">ID: <code>${s.id}</code> • ${s.questions.length} vragen</div>
              </div>
              <span class="text-xs font-bold text-sky-300">Openen →</span>
            `;
            btn.onclick = () => {
              el.inpSetId.value = s.id;
              el.inpSetTitle.value = s.title;
              if (s.categories.length) categories = s.categories;
              questions = s.questions;
              updateLinks();
              renderEditor();
              toast(`Set "${s.title}" geladen!`);
            };
            el.cloudSetsList.appendChild(btn);
          });
        } catch (err) {
          el.cloudSetsList.innerHTML = `<div class="text-xs text-rose-300">${err.message}</div>`;
        }
      }

      el.inpSetId.addEventListener('input', updateLinks);
      el.btnRefreshSets.addEventListener('click', refreshCloudSets);
      el.btnLoadDefaults.addEventListener('click', () => {
        categories = JSON.parse(JSON.stringify(window.BUZZ_CATEGORIES || []));
        questions = JSON.parse(JSON.stringify(window.BUZZ_QUESTIONS || []));
        renderEditor();
        toast('Standaard Mediawijsheid-vragen geladen!');
      });

      el.btnSaveCloud.addEventListener('click', async () => {
        el.btnSaveCloud.disabled = true;
        el.btnSaveCloud.textContent = '⏳ Opslaan...';
        try {
          const saved = await window.CloudQuizStore.saveSet({
            id: el.inpSetId.value,
            title: el.inpSetTitle.value,
            categories,
            questions,
            editPin: el.inpSetPin.value
          });
          updateLinks();
          await refreshCloudSets();
          toast(`☁️ Set "${saved.title}" opgeslagen en live!`);
        } catch (err) {
          toast(err.message, true);
        } finally {
          el.btnSaveCloud.disabled = false;
          el.btnSaveCloud.textContent = '☁️ Opslaan in Cloud';
        }
      });

      el.formAddCat.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = el.catTitle.value.trim();
        if (!title) return;
        const id = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || `cat-${Date.now()}`;
        categories.push({ id, title, subtitle: el.catSub.value.trim() || 'Eigen categorie', icon: el.catIcon.value || '🎮', color: 'from-indigo-400 to-violet-600' });
        el.catTitle.value = '';
        el.catSub.value = '';
        renderEditor();
      });

      el.formAddQ.addEventListener('submit', (e) => {
        e.preventDefault();
        const correct = Number(el.formAddQ.querySelector('input[name="qCorrect"]:checked').value || 0);
        const catId = el.qCat.value;
        questions.unshift({
          id: `q-${Date.now()}`,
          category: catId,
          badge: el.qBadge.value.trim() || catId,
          question: el.qText.value.trim(),
          options: el.qOpts.map((i) => i.value.trim()),
          correct,
          explanation: el.qExpl.value.trim() || 'Goed gedaan!'
        });
        el.qText.value = '';
        el.qOpts.forEach((i) => (i.value = ''));
        el.qExpl.value = '';
        renderEditor();
      });

      el.btnExportJson.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify({ categories, questions }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${el.inpSetId.value || 'quiz'}.json`;
        a.click();
      });

      el.inpFileUpload.addEventListener('change', async (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const text = await f.text();
        try {
          if (text.trim().startsWith('{')) {
            const parsed = JSON.parse(text);
            if (Array.isArray(parsed.categories)) categories = parsed.categories;
            if (Array.isArray(parsed.questions)) questions = parsed.questions;
            toast(`📂 ${questions.length} vragen geladen uit JSON!`);
          } else {
            const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
            let added = 0;
            lines.forEach((line, idx) => {
              const sep = line.includes(';') ? ';' : ',';
              const cols = line.split(sep).map((c) => c.trim().replace(/^"|"$/g, ''));
              if (cols.length < 7 || (idx === 0 && line.toLowerCase().includes('vraag'))) return;
              const [cat, badge, question, o1, o2, o3, o4, corr, expl] = cols.length >= 9 ? cols : [el.qCat.value, '📚 Import', ...cols];
              questions.unshift({ id: `csv-${Date.now()}-${idx}`, category: cat, badge, question, options: [o1, o2, o3, o4], correct: Math.max(0, Math.min(3, (parseInt(corr, 10) || 1) - 1)), explanation: expl || 'Goed!' });
              added++;
            });
            toast(`📊 ${added} vragen geïmporteerd uit CSV!`);
          }
          renderEditor();
        } catch (err) {
          toast('Kon bestand niet lezen: ' + err.message, true);
        }
        el.inpFileUpload.value = '';
      });

      document.querySelectorAll('[data-copy]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const target = document.getElementById(btn.dataset.copy);
          if (!target) return;
          await navigator.clipboard.writeText(target.value);
          toast('📋 Gekopieerd naar klembord!');
        });
      });

      updateLinks();
      renderEditor();
      refreshCloudSets();
    })();
  </script>
</body>
</html>
